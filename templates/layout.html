<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Erizopet: tienda online de erizos pigmeo africano y accesorios (ruedas, comida, hábitat y más)." />
  <title>{% block titulo%} {% endblock%}</title>

  <meta name="description" content="Erizopet: tienda online de erizos pigmeo africano y accesorios">

  <link rel="stylesheet" href="{{url_for('static', filename='css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{url_for('static', filename='css/all.min.css') }}">
  <link rel="stylesheet" href="{{url_for('static', filename='css/styles.css') }}">
</head>

<body>
  <header class="site-header" id="site-header">
    {% include 'components/navbar.html' %}
  </header>

  <main id="main">
    <div id="overlay" class="overlay" hidden></div>
    {% block contenido %}{% endblock %}
  </main>

 <!-- overlay modal (compartido) -->
  <div id="modalOverlay" class="modal-overlay" hidden aria-hidden="true"></div>

  <!-- MODAL LOGIN -->
<section id="modalLogin" class="modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle" hidden>
  <div class="modal__panel" role="document">
    <header class="modal__head">
      <h2 id="loginTitle" class="modal__title">
        🔐 Inicio de sesión
      </h2>
      <button class="modal__close" type="button" aria-label="Cerrar modal" data-close>
        ✕
      </button>
    </header>

    <form class="modal__form" id="formLogin" autocomplete="on">
      <label class="field">
        <span class="field__label">Email</span>
        <span class="field__icon" aria-hidden="true">📧</span>
        <input type="email" name="email" required placeholder="tucorreo@ejemplo.com" autocomplete="email" />
      </label>

      <label class="field">
        <span class="field__label">Contraseña</span>
        <span class="field__icon" aria-hidden="true">🔑</span>
        <input type="password" name="password" required placeholder="••••••••" autocomplete="current-password" />
      </label>

      <button class="btn btn--primary btn--full" type="submit">
        Entrar <span aria-hidden="true">→</span>
      </button>

      <p class="modal__hint">
        Demo UI: no hay validación real contra servidor.
      </p>
    </form>

    <footer class="modal__foot">
      <button type="button" class="btn btn--secondary btn--full" data-open="register">
        📝 Crear cuenta
      </button>
    </footer>
  </div>
</section>

<!-- MODAL REGISTER -->
<section id="modalRegister" class="modal" role="dialog" aria-modal="true" aria-labelledby="registerTitle" hidden>
  <div class="modal__panel" role="document">
    <header class="modal__head">
      <h2 id="registerTitle" class="modal__title">
        📝 Registro en Erizopet
      </h2>
      <button class="modal__close" type="button" aria-label="Cerrar modal" data-close>
        ✕
      </button>
    </header>

    <form  action="{{ url_for('signup')}}" method="post" class="modal__form" id="formRegister" autocomplete="on">
      <label class="field">
        <span class="field__label">Nombre</span>
        <span class="field__icon" aria-hidden="true">👤</span>
        <input type="text" name="nombre" required placeholder="Tu nombre" autocomplete="name" />
      </label>

      <label class="field">
        <span class="field__label">Email</span>
        <span class="field__icon" aria-hidden="true">📧</span>
        <input type="email" name="correo" required placeholder="tucorreo@ejemplo.com" autocomplete="email" />
      </label>

      <label class="field">
        <span class="field__label">Contraseña</span>
        <span class="field__icon" aria-hidden="true">🔒</span>
        <input type="password" name="clave" required placeholder="Crea una contraseña" autocomplete="new-password" />
      </label>

      <label class="field">
        <span class="field__label">Confirmar contraseña</span>
        <span class="field__icon" aria-hidden="true">✅</span>
        <input type="password" name="confirm" required placeholder="Repite la contraseña" autocomplete="new-password" />
      </label>

      <button class="btn btn--primary btn--full" type="submit">
        Crear cuenta <span aria-hidden="true">→</span>
      </button>

      <p class="modal__hint">
        Demo UI: no se envía información.
      </p>
    </form>
    <footer class="modal__foot">
      <button type="button" class="btn btn--secondary btn--full" data-open="login">
        🔐 Ya tengo cuenta
      </button>
    </footer>
  </div>
</section>

{% include 'components/footer.html' %}

<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/all.js') }}"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
